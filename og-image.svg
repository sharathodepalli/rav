<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="150" fill="#1e40af" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#3b82f6" opacity="0.1"/>
  
  <!-- Logo/Icon -->
  <rect x="80" y="80" width="60" height="60" rx="12" fill="url(#text-gradient)"/>
  <text x="110" y="125" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">S</text>
  
  <!-- Main heading -->
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#text-gradient)">
    Invoice Automation
  </text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">
    in 10 Days
  </text>
  
  <!-- Subheading -->
  <text x="80" y="400" font-family="Arial, sans-serif" font-size="32" fill="#cbd5e1">
    Email → AI → ERP Integration
  </text>
  
  <!-- Stats -->
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#60a5fa">
    ✓ 80% Faster Processing
  </text>
  <text x="480" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#60a5fa">
    ✓ 10-Day Setup
  </text>
  <text x="840" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#60a5fa">
    ✓ 100% Accuracy
  </text>
  
  <!-- Domain -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">
    thetrueshades.com
  </text>
</svg>
